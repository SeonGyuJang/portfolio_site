<!DOCTYPE html>
<html lang="{{ lang or 'ko' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.classList.add('js')</script>
    <title>{{ t('title') }}</title>
    <meta name="description" content="{{ profile.headline }}">
    <link rel="alternate" hreflang="ko" href="{{ url_for('index', _external=True) }}">
    <link rel="alternate" hreflang="en" href="{{ url_for('index_en', _external=True) }}">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="wrap topbar-inner">
            <a href="#about" class="brand">{{ profile.name }}</a>
            <nav class="nav" aria-label="Sections">
                <a href="#publications">{{ t('nav_publications') }}</a>
                <a href="#projects">{{ t('nav_projects') }}</a>
                <a href="#experience">{{ t('nav_experience') }}</a>
                <a href="#awards">{{ t('nav_awards') }}</a>
                <a href="#certifications">{{ t('nav_certs') }}</a>
            </nav>
            <div class="topbar-actions">
                <div class="lang-switch" role="group" aria-label="Language">
                    <a href="{{ url_for('index') }}" class="{{ 'active' if lang == 'ko' }}" hreflang="ko">KR</a>
                    <a href="{{ url_for('index_en') }}" class="{{ 'active' if lang == 'en' }}" hreflang="en">EN</a>
                </div>
                <a href="{{ url_for('download_cv') }}" class="btn-cv" download>
                    <i class="fas fa-download"></i><span>CV</span>
                </a>
            </div>
        </div>
    </header>

    <main class="wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="wrap footer">
        <span>© {{ last_updated[:4] }} SeonGyu Jang</span>
        <span>{{ t('last_updated') }} {{ last_updated }}</span>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
